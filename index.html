<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f141d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="SKYRUSH: build a custom racing aircraft and fly the Caldera Ridge circuit at full speed."
    />
    <meta name="apple-mobile-web-app-title" content="SKYRUSH" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>SKYRUSH</title>
    <!-- HaveAnApp Pulse: anonymous, cookieless usage counts, plus a random returning-visitor id kept on this device for this app. -->
    <script
      defer
      src="https://haveanapp-pulse-collect.vercel.app/p.js"
      data-app="skyrush"
      data-returning="on"
    ></script>
    <script>
      window.pulse =
        window.pulse ||
        function () {
          (pulse.q = pulse.q || []).push(arguments);
        };
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
