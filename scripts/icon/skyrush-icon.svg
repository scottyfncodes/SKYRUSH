<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024">
  <!--
    SKYRUSH app icon: an air-race poster. Ink-blue sky, a sun-faded sun the aircraft
    crosses, warm haze on the horizon over mesas and the coast, and the Meridian in its
    Vintage Air-Racer livery rendered from the game's own model (aircraft.png, made by
    build-aircraft.mjs). Classes: .detail is dropped for the favicon, .sun stays.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f1a2e"/>
      <stop offset="0.45" stop-color="#1b2c4b"/>
      <stop offset="0.72" stop-color="#2f4466"/>
      <stop offset="0.86" stop-color="#8a6f5c"/>
      <stop offset="1" stop-color="#d9b48a"/>
    </linearGradient>
    <radialGradient id="sunDisc" cx="560" cy="470" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6dc8e"/>
      <stop offset="0.7" stop-color="#e8b84a"/>
      <stop offset="1" stop-color="#d99a35"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="560" cy="470" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0.55" stop-color="#e8b84a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#e8b84a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="700" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f1e8d4" stop-opacity="0"/>
      <stop offset="1" stop-color="#f1e8d4" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="900" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f6f6b"/>
      <stop offset="1" stop-color="#123c46"/>
    </linearGradient>
    <clipPath id="sunClip">
      <circle cx="560" cy="470" r="272"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect class="sun" width="1024" height="1024" fill="url(#sunGlow)"/>
  <circle class="sun" cx="560" cy="470" r="272" fill="url(#sunDisc)"/>
  <!-- Sun-faded bands across the lower half of the sun, like a printed poster. -->
  <g class="detail" fill="#1b2c4b" opacity="0.22" clip-path="url(#sunClip)">
    <rect x="280" y="600" width="560" height="14"/>
    <rect x="280" y="636" width="560" height="11"/>
    <rect x="280" y="668" width="560" height="8"/>
  </g>

  <rect class="detail" y="680" width="1024" height="240" fill="url(#haze)"/>
  <!-- Distant mesas, a nearer headland, and the coast. -->
  <path class="detail" fill="#b8603e" d="M0 846 L70 846 L92 812 L210 812 L232 846 L410 852 L430 826 L520 826 L540 856 L1024 858 L1024 1024 L0 1024 Z"/>
  <path class="detail" fill="#7a3f30" d="M560 870 L640 870 L662 832 L820 832 L846 872 L1024 872 L1024 1024 L560 1024 Z"/>
  <rect y="896" width="1024" height="128" fill="url(#sea)"/>
  <path class="detail" fill="#f1e8d4" opacity="0.55" d="M0 914 H1024 V920 H0 Z"/>
  <path class="detail" fill="#f1e8d4" opacity="0.25" d="M120 948 H470 V952 H120 Z M610 972 H940 V976 H610 Z"/>

  <!-- Speed lines trailing the aircraft. -->
  <g class="detail" stroke="#f1e8d4" stroke-linecap="round" fill="none">
    <path d="M58 690 L300 590" stroke-width="7" opacity="0.7"/>
    <path d="M110 760 L330 670" stroke-width="5" opacity="0.5"/>
    <path d="M40 600 L210 530" stroke-width="4" opacity="0.4"/>
  </g>

  <g id="subject-wrap">
    <image id="aircraft" href="aircraft.png" x="18" y="-6" width="1000" height="1000"/>
  </g>
</svg>
